name = "syndication-event-finder"
main = "worker.js"
compatibility_date = "2024-11-01"

# Non-secret vars. ALLOWED_EMAILS_DOC_ID points at the live "approved
# emails" allow-list Google Doc (the ID between /d/ and /edit in its URL).
# That doc must be shared "Anyone with the link: Viewer" so the Worker can
# read it without auth. With this set, editing the doc updates who's
# allowed in — no redeploy, no `wrangler secret put`. See README.md.
[vars]
ALLOWED_EMAILS_DOC_ID = "10rgVyj4uQg8rC4IJNe7Qp4k1QC43YmIBlL9oczWjtLk"
# ALLOWED_EMAILS_CACHE_TTL_SECONDS = "300"
# ANTHROPIC_MODEL = "claude-sonnet-4-5-20250929"
# ALLOWED_ORIGIN = "https://twishnoff.github.io"
#
# Secrets (ANTHROPIC_API_KEY, and optionally ALLOWED_EMAILS as a fallback)
# should NOT be put here — set them with `wrangler secret put` instead (see
# README.md).
